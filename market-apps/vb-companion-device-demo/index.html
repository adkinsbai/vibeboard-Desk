<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>本地陪伴小电脑</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="companion-screen" aria-label="本地陪伴小电脑">
    <header class="status-line">
      <span id="connectionStatus" data-connection="offline">离线试玩</span>
      <span id="expressionLabel">IDLE</span>
      <span id="skinLabel">BOT FACE</span>
    </header>

    <section id="companion" class="companion" aria-live="polite">
      <div class="antenna"><i></i></div>
      <div class="face-shell">
        <div class="eye eye-left"><b></b></div>
        <div class="eye eye-right"><b></b></div>
        <div class="mouth"><i></i></div>
      </div>
      <div class="life-line" aria-hidden="true"><i></i></div>
      <p id="moodLine">我在这里。</p>
    </section>

    <section class="conversation-panel" aria-label="对话">
      <div id="messageLog" class="message-log" aria-live="polite"></div>
      <p id="transcriptLine" class="transcript-line" hidden></p>
      <p id="interactionStatus" class="interaction-status">可以和我说说话。</p>
      <form id="messageForm" class="composer">
        <input id="messageInput" type="text" maxlength="8000" autocomplete="off" placeholder="写一句话…" aria-label="输入消息">
        <button id="sendMessage" class="icon-button" type="submit" aria-label="发送消息" title="发送消息">↑</button>
        <button id="micButton" class="icon-button" type="button" aria-label="按住或点击开始说话" title="开始说话">●</button>
      </form>
      <label class="tts-toggle"><input id="ttsEnabled" type="checkbox" checked> 播报回复</label>
      <button id="replayAudio" class="replay-button" type="button" hidden>再播一次</button>
    </section>

    <section id="memoryOverlay" class="memory-overlay" aria-label="记忆检索" hidden>
      <div class="memory-head">
        <strong>MEMORY / RANKED RAG</strong>
        <button id="closeMemory" type="button" aria-label="关闭记忆面板" title="关闭">×</button>
      </div>
      <input id="memoryQuery" value="陪伴" aria-label="记忆查询">
      <div id="memoryResults" class="memory-results"></div>
    </section>

    <nav class="controls" aria-label="试玩控制">
      <button id="key1" type="button"><kbd>1</kbd><span>表情</span></button>
      <button id="key2" type="button"><kbd>2</kbd><span>记忆</span></button>
      <button id="key3" type="button"><kbd>3</kbd><span>皮肤</span></button>
    </nav>
  </main>
  <script src="./app.js"></script>
</body>
</html>
