<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=480, initial-scale=1.0">
  <title>Spinning Circle</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <div id="circle-container">
      <div id="spinner"></div>
    </div>
    <div id="info-panel">
      <div id="status-line"><span id="status-label">Status</span><span id="status-value">--</span></div>
      <div id="temp-line"><span id="temp-label">CPU Temp</span><span id="temp-value">--</span></div>
      <div id="mem-line"><span id="mem-label">Memory</span><span id="mem-value">--</span></div>
      <div id="disk-line"><span id="disk-label">Disk</span><span id="disk-value">--</span></div>
      <div id="uptime-line"><span id="uptime-label">Uptime</span><span id="uptime-value">--</span></div>
    </div>
    <div id="build-badge"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
