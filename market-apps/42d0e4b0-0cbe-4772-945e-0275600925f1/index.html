<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=480,height=360,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Racing Game</title><link rel="stylesheet" href="./style.css"></head><body><div id="app"><div id="game-container"><canvas id="gameCanvas" width="480" height="360"></canvas><div id="hud"><span id="scoreDisplay">Score: 0</span><span id="statusDisplay">Running</span></div><div id="gameOverOverlay" class="hidden"><div id="gameOverBox"><p id="finalScore">Score: 0</p><p>Press SPACE to restart</p></div></div></div><div id="hardware-panel" class="hidden"><div id="hardware-info"><div class="info-row"><span class="label">Host</span><span id="hostname">-</span></div><div class="info-row"><span class="label">CPU Temp</span><span id="cpuTemp">-</span></div><div class="info-row"><span class="label">Memory</span><span id="memory">-</span></div><div class="info-row"><span class="label">Disk</span><span id="disk">-</span></div><div class="info-row"><span class="label">WiFi</span><span id="wifi">-</span></div><div class="info-row"><span class="label">IP</span><span id="ip">-</span></div></div></div></div><script src="./app.js"></script></body></html>
