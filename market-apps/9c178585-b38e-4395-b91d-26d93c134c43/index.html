<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=480, height=360, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <span id="score-label">SCORE</span>

      <span id="build-info"></span>
      <span id="prompt-info"></span>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
